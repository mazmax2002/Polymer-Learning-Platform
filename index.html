<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Polymer Learning | 🧪✨</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 สำหรับ Alert สวยงาม -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Mali:wght@400;600;700&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-cute: #fff0f5; /* LavenderBlush */
            --panel-bg: rgba(255, 255, 255, 0.85);
            --text-main: #475569;
        }
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg-cute);
            /* พื้นหลังสีพาสเทลไล่เฉด */
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(251, 207, 232, 0.6), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(191, 219, 254, 0.6), transparent 40%),
                radial-gradient(circle at 50% 90%, rgba(254, 240, 138, 0.4), transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        .font-cute { font-family: 'Mali', cursive; }
        
        /* กล่องข้อความสไตล์กระจกขุ่น น่ารักๆ */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 4px solid white;
            box-shadow: 0 10px 30px -5px rgba(251, 113, 133, 0.15);
            border-radius: 2rem;
        }

        /* ปุ่มกดแบบ 3D เยลลี่ */
        .btn-3d {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            border-radius: 9999px; /* Pill shape */
            font-weight: 700;
            border-bottom-width: 6px;
            font-family: 'Mali', cursive;
        }
        .btn-3d:active:not(:disabled) {
            transform: translateY(6px);
            border-bottom-width: 0px;
            margin-top: 6px;
        }
        
        .btn-pink { background: linear-gradient(145deg, #fb7185, #f43f5e); border-color: #be123c; color: white; }
        .btn-blue { background: linear-gradient(145deg, #60a5fa, #3b82f6); border-color: #1d4ed8; color: white; }
        .btn-sky { background: linear-gradient(145deg, #38bdf8, #0ea5e9); border-color: #0284c7; color: white; }
        .btn-yellow { background: linear-gradient(145deg, #fde047, #facc15); border-color: #ca8a04; color: #78350f; }
        .btn-green { background: linear-gradient(145deg, #34d399, #10b981); border-color: #047857; color: white; }
        .btn-purple { background: linear-gradient(145deg, #c084fc, #a855f7); border-color: #7e22ce; color: white; }
        .btn-white { background: white; border-color: #e2e8f0; color: #64748b; }

        /* สไตล์สำหรับใบงานเสมือนจริง (น่ารัก) */
        .worksheet-paper {
            background: white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            background-image: 
                linear-gradient(90deg, transparent 79px, #fecdd3 79px, #fecdd3 81px, transparent 81px),
                linear-gradient(#f8fafc .1em, transparent .1em);
            background-size: 100% 1.5em;
            padding: 50px 40px 40px 100px;
            border-radius: 1.5rem;
            border: 2px solid #fecdd3;
        }
        /* เทปกาวตกแต่ง */
        .washi-tape {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            width: 150px;
            height: 35px;
            background-color: rgba(253, 164, 175, 0.6);
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        .worksheet-paper::before {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 30px;
            width: 2px;
            background: #f43f5e;
        }
        .worksheet-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px dashed #cbd5e1;
            line-height: 1.8;
            outline: none;
            resize: none;
            font-size: 1.2rem;
            color: #334155;
            margin-bottom: 1.5rem;
            padding-bottom: 5px;
        }
        .worksheet-input:focus { border-bottom-color: #fb7185; }

        /* Video Container Ratio */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 4px solid #fff;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* การตั้งค่าสำหรับการพิมพ์ PDF ให้ประหยัดหมึก */
        @media print {
            body { background: white; }
            .no-print { display: none !important; }
            .worksheet-paper {
                box-shadow: none;
                padding: 20px;
                background-image: none;
                border: none;
            }
            .worksheet-paper::before, .washi-tape { display: none; }
            .worksheet-input { border-bottom: 1px solid #ccc; font-family: 'Sarabun', sans-serif; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }

        /* อนิเมชันห้องทดลอง & ลอยไปมา */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
        }
        @keyframes dropIn {
            0% { transform: translateY(-40px) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes shakeCute {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(-8deg); }
            75% { transform: rotate(8deg); }
        }
        .anim-float { animation: float 4s ease-in-out infinite; }
        .anim-drop { animation: dropIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .anim-shake { animation: shakeCute 0.5s infinite; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(251, 113, 133, 0.4); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(251, 113, 133, 0.7); }
    </style>
</head>
<body class="relative">

    <!-- ของตกแต่งลอยได้ด้านหลัง -->
    <div class="fixed top-20 left-10 text-6xl opacity-30 anim-float pointer-events-none z-0" style="animation-delay: 0s;">☁️</div>
    <div class="fixed top-40 right-16 text-5xl opacity-40 anim-float pointer-events-none z-0" style="animation-delay: 1.5s;">✨</div>
    <div class="fixed bottom-20 left-1/4 text-6xl opacity-30 anim-float pointer-events-none z-0" style="animation-delay: 2.2s;">🌸</div>
    <div class="fixed bottom-32 right-10 text-7xl opacity-20 anim-float pointer-events-none z-0" style="animation-delay: 0.8s;">🧪</div>

    <!-- Top Navigation (แบบลอยตัว น่ารัก) -->
    <div class="no-print p-4 w-full max-w-7xl mx-auto relative z-50">
        <nav class="glass-panel px-6 py-4 flex justify-between items-center shadow-lg">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-pink-100 rounded-full flex items-center justify-center text-rose-500 text-2xl shadow-inner border-2 border-white">
                    <i class="fa-solid fa-flask"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-cute font-bold text-rose-500 leading-none">Polymer Learning</h1>
                    <p class="text-xs text-rose-400 font-bold tracking-wider uppercase mt-1">Fun Chemistry 🌟</p>
                </div>
            </div>
            <div id="nav-user-info" class="font-bold flex items-center gap-3"></div>
        </nav>
    </div>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-1 w-full max-w-7xl mx-auto p-4 md:p-6 relative z-10 flex flex-col justify-center"></main>

    <script>
        // --- STREAMING_CHUNK: Initializing state and game data... ---
        const GAME_KEY = 'polymer_learning_cute_v3';
        let state = {
            players: {}, // เก็บข้อมูลนักเรียน
            status: 'login' // login, student_hub, teacher_dash
        };
        let currentUser = null;

        // คำถามสำหรับทดสอบ (ง่ายกระชับ)
        const questions = [
            { q: "ข้อใดคือความหมายของพอลิเมอร์?", options: ["สารโมเลกุลใหญ่ที่เกิดจากมอนอเมอร์ต่อกัน", "สารละลายเข้มข้น", "ธาตุหมู่ 8", "สารที่พบในพลาสติกเท่านั้น"], a: 0 },
            { q: "ปฏิกิริยาการเกิดพอลิเมอร์แบบเติม มีลักษณะอย่างไร?", options: ["มีน้ำหลุดออกมา", "มอนอเมอร์มีพันธะคู่และไม่มีสารอื่นหลุดออกมา", "ต้องใช้ความเย็นสูง", "เกิดเป็นโครงร่างตาข่ายเสมอ"], a: 1 },
            { q: "พอลิเมอร์ในข้อใดเกิดจากปฏิกิริยาแบบควบแน่น?", options: ["พีวีซี (PVC)", "พอลิเอทิลีน", "ไนลอน", "เทฟลอน"], a: 2 },
            { q: "สิ่งที่มักหลุดออกมาเป็นผลพลอยได้จากปฏิกิริยาแบบควบแน่นคือสิ่งใด?", options: ["ก๊าซคาร์บอนไดออกไซด์", "ก๊าซออกซิเจน", "น้ำ (H2O)", "ก๊าซไฮโดรเจน"], a: 2 },
            { q: "พลาสติกที่ใช้ทำขวดน้ำดื่ม (PET) เป็นพอลิเมอร์ประเภทใด?", options: ["แบบเติม", "แบบควบแน่น", "แบบร่างแห", "ยางธรรมชาติ"], a: 1 }
        ];

        // กำหนด Custom SweetAlert Theme ให้เข้ากับความน่ารัก
        const Toast = Swal.mixin({
            customClass: { popup: 'rounded-3xl border-4 border-pink-100 shadow-xl font-cute' }
        });

        function loadState() {
            const saved = localStorage.getItem(GAME_KEY);
            if (saved) state = JSON.parse(saved);
        }
        function saveState() {
            localStorage.setItem(GAME_KEY, JSON.stringify(state));
        }

        // --- STREAMING_CHUNK: App Router and UI Rendering... ---
        function render() {
            const app = document.getElementById('app-content');
            const navUser = document.getElementById('nav-user-info');

            if (state.status === 'login') {
                navUser.innerHTML = '';
                app.innerHTML = renderLogin();
            } else if (state.status === 'student_hub') {
                navUser.innerHTML = `
                    <div class="bg-blue-100 border-2 border-white shadow-sm text-blue-600 px-5 py-2 rounded-full flex items-center gap-2">
                        <img src="https://api.dicebear.com/7.x/notionists/svg?seed=${currentUser}&backgroundColor=transparent" class="w-6 h-6 rounded-full bg-white"> 
                        <span class="truncate max-w-[100px] md:max-w-[200px]">${currentUser}</span>
                    </div> 
                    <button onclick="logout()" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-rose-400 hover:text-white hover:bg-rose-400 border-2 border-rose-100 transition shadow-sm">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>`;
                app.innerHTML = renderStudentHub();
            } else if (state.status === 'teacher_dash') {
                navUser.innerHTML = `
                    <span class="bg-indigo-100 border-2 border-white shadow-sm text-indigo-700 px-5 py-2 rounded-full">
                        <i class="fa-solid fa-chalkboard-user mr-2"></i> แผงควบคุม
                    </span> 
                    <button onclick="logout()" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-rose-400 hover:text-white hover:bg-rose-400 border-2 border-rose-100 transition shadow-sm">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>`;
                app.innerHTML = renderTeacherDash();
            }
        }

        function logout() {
            currentUser = null;
            state.status = 'login';
            render();
        }

        // --- STREAMING_CHUNK: Redesigned Login Screen... ---
        function renderLogin() {
            return `
                <div class="flex flex-col items-center justify-center w-full max-w-lg mx-auto anim-drop">
                    <!-- การ์ดหลักตรงกลาง -->
                    <div class="glass-panel p-8 w-full border-t-[8px] border-t-pink-400 flex flex-col items-center shadow-2xl relative">
                        <!-- ไอคอนลอยตรงกลาง -->
                        <div class="absolute -top-12 bg-white rounded-full p-4 shadow-md border-4 border-pink-100">
                            <i class="fa-solid fa-graduation-cap text-6xl text-pink-400"></i>
                        </div>
                        
                        <div class="text-center mt-10 mb-8 w-full">
                            <h2 class="text-4xl font-cute font-black text-slate-700">เข้าเรียนกันเถอะ! 🌟</h2>
                            <p class="text-slate-500 mt-3 font-bold text-lg">พิมพ์ชื่อ-นามสกุล ตรงนี้เลยจ้า</p>
                        </div>
                        
                        <input type="text" id="studentName" placeholder="นาย/นางสาว..." 
                            class="w-full bg-white border-4 border-pink-100 rounded-2xl px-6 py-4 text-xl font-bold focus:border-pink-400 outline-none mb-6 text-center shadow-inner text-slate-700 placeholder-slate-300 transition-colors">
                        
                        <button onclick="loginStudent()" class="w-full btn-3d btn-pink py-4 text-2xl mb-4">
                            <i class="fa-solid fa-rocket mr-2"></i> ไปลุยกันเลย!
                        </button>
                    </div>

                    <!-- ปุ่มสำหรับครูแยกมาด้านล่าง -->
                    <div class="mt-8">
                        <button onclick="promptTeacherLogin()" class="bg-white/80 backdrop-blur-sm border-2 border-indigo-100 text-indigo-500 hover:bg-indigo-50 px-8 py-3 rounded-full font-bold shadow-sm transition-all flex items-center gap-2">
                            <i class="fa-solid fa-key"></i> สำหรับคุณครู
                        </button>
                    </div>
                </div>
            `;
        }

        function loginStudent() {
            const name = document.getElementById('studentName').value.trim();
            if (!name) {
                Toast.fire({ icon: 'warning', title: 'อ๊ะ!', text: 'อย่าลืมพิมพ์ชื่อก่อนเข้านะจ๊ะ', confirmButtonColor: '#fb7185' });
                return;
            }
            if (!state.players[name]) {
                state.players[name] = { name: name, preTest: null, postTest: null, worksheet: null };
                saveState();
            }
            currentUser = name;
            state.status = 'student_hub';
            render();
        }

        function promptTeacherLogin() {
            Swal.fire({
                title: '<span class="font-cute text-3xl text-indigo-600">รหัสผ่านคุณครู</span>',
                html: '<p class="text-slate-500 mb-4 font-cute">กรุณาใส่รหัสผ่าน</p>',
                input: 'password',
                inputAttributes: { autocapitalize: 'off', class: 'text-center text-2xl font-bold border-4 border-indigo-100 rounded-xl p-3 outline-none focus:border-indigo-400' },
                showCancelButton: true,
                confirmButtonText: 'เข้าสู่ระบบ',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#6366f1',
                cancelButtonColor: '#94a3b8',
                customClass: { popup: 'rounded-3xl border-4 border-indigo-100 shadow-2xl font-cute' }
            }).then((result) => {
                if (result.isConfirmed) {
                    if (result.value === '1234') {
                        state.status = 'teacher_dash';
                        render();
                    } else {
                        Toast.fire({ icon: 'error', title: 'รหัสผิด!', text: 'รหัสผ่านไม่ถูกต้องครับ', confirmButtonColor: '#ef4444' });
                    }
                }
            });
        }

        // --- STREAMING_CHUNK: Student Hub (Map) UI updated with 5 items... ---
        function renderStudentHub() {
            const p = state.players[currentUser];
            const preDone = p.preTest !== null;
            const wsDone = p.worksheet !== null;
            const postDone = p.postTest !== null;

            return `
                <div class="text-center mb-10 anim-drop">
                    <h2 class="text-4xl md:text-5xl font-cute font-black text-rose-500 drop-shadow-sm">แผนที่ภารกิจ 🗺️</h2>
                    <p class="text-slate-600 mt-2 font-bold text-lg">ทำภารกิจตามลำดับให้ครบ เพื่อเป็นอัจฉริยะพอลิเมอร์!</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 anim-drop max-w-5xl mx-auto" style="animation-delay: 0.1s;">
                    
                    <!-- 1. ทดสอบก่อนเรียน (Pink) -->
                    <div class="glass-panel p-6 border-t-8 ${preDone ? 'border-t-green-400 bg-green-50/30' : 'border-t-pink-400'} flex flex-col items-center text-center group">
                        <div class="w-20 h-20 rounded-full bg-white border-4 ${preDone ? 'border-green-300 text-green-500' : 'border-pink-200 text-pink-500'} flex items-center justify-center text-4xl mb-4 shadow-sm group-hover:scale-110 transition-transform">
                            ${preDone ? '<i class="fa-solid fa-check"></i>' : '📝'}
                        </div>
                        <h3 class="text-2xl font-cute font-bold text-slate-700 mb-2">๑. วัดความรู้</h3>
                        <p class="text-sm font-bold text-slate-500 mb-4 flex-1">ก่อนเรียนทำได้แค่ไหน ไม่ต้องกลัวผิด</p>
                        ${preDone 
                            ? `<div class="font-black text-green-500 text-2xl mb-2 flex items-center gap-2">⭐ ${p.preTest} / 5</div>
                               <button onclick="startActivity('quiz', 'pre')" class="text-slate-400 underline font-bold text-sm hover:text-pink-500">ทำใหม่</button>`
                            : `<button onclick="startActivity('quiz', 'pre')" class="w-full btn-3d btn-pink py-3 text-lg">เริ่มเล๊ย!</button>`
                        }
                    </div>

                    <!-- 2. เรียนรู้เนื้อหา (Sky) -->
                    <div class="glass-panel p-6 border-t-8 border-t-sky-400 flex flex-col items-center text-center group ${!preDone ? 'opacity-60 grayscale' : ''}">
                        <div class="w-20 h-20 rounded-full bg-white border-4 border-sky-200 text-sky-500 flex items-center justify-center text-4xl mb-4 shadow-sm group-hover:scale-110 transition-transform">
                            📖
                        </div>
                        <h3 class="text-2xl font-cute font-bold text-slate-700 mb-2">๒. บทเรียน & วิดีโอ</h3>
                        <p class="text-sm font-bold text-slate-500 mb-4 flex-1">อ่านสรุปความรู้และดูวิดีโอสอน</p>
                        <button onclick="${preDone ? `startActivity('lesson')` : `Toast.fire('ล็อคอยู่!','ต้องทำทดสอบก่อนเรียนก่อนนะ','info')`}" class="w-full btn-3d btn-sky py-3 text-lg">
                            ${preDone ? 'เปิดตำรา' : '<i class="fa-solid fa-lock"></i> ล็อค'}
                        </button>
                    </div>

                    <!-- 3. ห้องทดลอง (Purple) -->
                    <div class="glass-panel p-6 border-t-8 border-t-purple-400 flex flex-col items-center text-center group ${!preDone ? 'opacity-60 grayscale' : ''}">
                        <div class="w-20 h-20 rounded-full bg-white border-4 border-purple-200 text-purple-500 flex items-center justify-center text-4xl mb-4 shadow-sm group-hover:scale-110 transition-transform">
                            🧪
                        </div>
                        <h3 class="text-2xl font-cute font-bold text-slate-700 mb-2">๓. ห้องวิจัย</h3>
                        <p class="text-sm font-bold text-slate-500 mb-4 flex-1">ผสมสารจำลอง ดูปฏิกิริยาพอลิเมอร์</p>
                        <button onclick="${preDone ? `startActivity('lab')` : `Toast.fire('ล็อคอยู่!','ต้องทำทดสอบก่อนเรียนก่อนนะ','info')`}" class="w-full btn-3d btn-purple py-3 text-lg">
                            ${preDone ? 'สวมเสื้อกาวน์' : '<i class="fa-solid fa-lock"></i> ล็อค'}
                        </button>
                    </div>

                    <!-- 4. ใบงานออนไลน์ (Orange/Yellow) - จัดให้อยู่ตรงกลางแถวสอง -->
                    <div class="glass-panel p-6 border-t-8 ${wsDone ? 'border-t-green-400 bg-green-50/30' : 'border-t-yellow-400'} flex flex-col items-center text-center group md:col-start-1 lg:col-start-2 ${!preDone ? 'opacity-60 grayscale' : ''}">
                        <div class="w-20 h-20 rounded-full bg-white border-4 ${wsDone ? 'border-green-300 text-green-500' : 'border-yellow-200 text-yellow-500'} flex items-center justify-center text-4xl mb-4 shadow-sm group-hover:scale-110 transition-transform">
                            ${wsDone ? '<i class="fa-solid fa-check"></i>' : '✍️'}
                        </div>
                        <h3 class="text-2xl font-cute font-bold text-slate-700 mb-2">๔. ใบงาน</h3>
                        <p class="text-sm font-bold text-slate-500 mb-4 flex-1">สรุปความเข้าใจ พิมพ์ส่งคุณครู</p>
                        ${wsDone

                            <div class="mb-8">
                                <label class="block font-bold text-xl text-slate-700 mb-3">๒. ปฏิกิริยาแบบเติม กับ แบบควบแน่น ต่างกันยังไงนะ? (อธิบายจากที่ลองผสมสารดูสิ) 🧪</label>
                                <textarea id="ws-q2" class="worksheet-input font-cute text-blue-700" rows="3" placeholder="พิมพ์คำตอบที่นี่..." ${isDone ? 'readonly' : 'required'}>${ans[1]}</textarea>
                            </div>

                            <div class="mb-8">
                                <label class="block font-bold text-xl text-slate-700 mb-3">๓. ลองมองไปรอบตัว ยกตัวอย่างของที่ทำจากพอลิเมอร์มาสัก ๓ อย่างสิ 🔍</label>
                                <textarea id="ws-q3" class="worksheet-input font-cute text-blue-700" rows="2" placeholder="เช่น ขวดน้ำ, ถุง..." ${isDone ? 'readonly' : 'required'}>${ans[2]}</textarea>
                            </div>

                            ${!isDone ? `
                                <div class="text-center mt-12 no-print">
                                    <button type="submit" class="btn-3d btn-pink py-4 px-12 text-2xl">
                                        <i class="fa-solid fa-paper-plane mr-2"></i> ส่งใบงานให้คุณครู!
                                    </button>
                                </div>
                            ` : `
                                <div class="text-center mt-10 no-print">
                                    <div class="inline-block ${p.worksheetGraded ? 'bg-green-100 border-green-300 text-green-600' : 'bg-amber-100 border-amber-300 text-amber-600'} border-4 font-cute font-black text-2xl px-8 py-4 rounded-[2rem] transform -rotate-2">
                                        ${p.worksheetGraded 
                                            ? `<i class="fa-solid fa-check-circle mr-2"></i> ได้คะแนน ${p.worksheetScore} / 10 ยอดเยี่ยม!` 
                                            : `<i class="fa-solid fa-hourglass-half mr-2"></i> ส่งเรียบร้อยแล้วจ้า! รอคุณครูตรวจนะ`}
                                    </div>
                                </div>
                            `}
                        </form>
                    </div>
                </div>
            `;
        }

        window.submitWorksheet = function(e) {
            e.preventDefault();
            const q1 = document.getElementById('ws-q1').value;
            const q2 = document.getElementById('ws-q2').value;
            const q3 = document.getElementById('ws-q3').value;

            state.players[currentUser].worksheet = [q1, q2, q3];
            state.players[currentUser].worksheetScore = null;
            state.players[currentUser].worksheetGraded = false;
            saveState();

            Swal.fire({
                title: '<span class="font-cute text-3xl text-green-500">ส่งสำเร็จ! เย้! 🎉</span>',
                html: '<p class="text-slate-600 font-bold font-cute">เขียนได้เยี่ยมมาก รอคุณครูตรวจ แล้วไปลุยสอบรอบสุดท้ายได้เลย!</p>',
                icon: 'success',
                confirmButtonColor: '#22c55e',
                customClass: { popup: 'rounded-3xl border-4 border-green-200 shadow-xl font-cute' }
            }).then(() => { render(); });
        }

        // --- STREAMING_CHUNK: Teacher Dashboard UI... ---
        function renderTeacherDash() {
            const players = Object.values(state.players);
            let html = `
                <div class="glass-panel p-6 md:p-10 border-t-8 border-t-indigo-400 w-full anim-drop">
                    <div class="flex flex-col md:flex-row justify-between items-center mb-10 pb-6 border-b-4 border-dashed border-indigo-100">
                        <div class="text-center md:text-left">
                            <h2 class="text-4xl font-cute font-black text-indigo-500 flex items-center justify-center md:justify-start gap-3 mb-2">
                                <i class="fa-solid fa-chart-line"></i> แผงควบคุม (Dashboard)
                            </h2>
                            <p class="text-slate-500 font-bold text-lg">สรุปผลคะแนนน่ารักๆ ของนักเรียนทุกคน 📊</p>
                        </div>
                        <div class="flex flex-wrap justify-center gap-3 mt-6 md:mt-0">
                            <button onclick="exportExcel()" class="bg-white border-2 border-emerald-200 text-emerald-500 hover:bg-emerald-50 px-5 py-2.5 rounded-full font-bold shadow-sm flex items-center gap-2 transition-colors">
                                <i class="fa-solid fa-file-excel"></i> โหลด Excel
                            </button>
                            <button onclick="confirmClearData()" class="bg-white border-2 border-rose-200 text-rose-500 hover:bg-rose-50 px-5 py-2.5 rounded-full font-bold shadow-sm flex items-center gap-2 transition-colors">
                                <i class="fa-solid fa-trash"></i> ล้างห้องเรียน
                            </button>
                        </div>
                    </div>

                    <div class="overflow-x-auto bg-white rounded-3xl border-4 border-indigo-50 shadow-sm">
                        <table class="w-full text-left border-collapse min-w-[800px]">
                            <thead>
                                <tr class="bg-indigo-100 text-indigo-700">
                                    <th class="p-5 font-cute font-bold text-xl rounded-tl-2xl">ชื่อนักเรียน</th>
                                    <th class="p-5 font-cute font-bold text-xl text-center">ก่อนเรียน (5)</th>
                                    <th class="p-5 font-cute font-bold text-xl text-center">ใบงาน 📝</th>
                                    <th class="p-5 font-cute font-bold text-xl text-center">หลังเรียน (5)</th>
                                    <th class="p-5 font-cute font-bold text-xl text-center rounded-tr-2xl">พัฒนาการ 🌟</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y-2 divide-indigo-50">
            `;

            if (players.length === 0) {
                html += `<tr><td colspan="5" class="text-center p-12 text-slate-400 font-bold text-lg">ยังไม่มีข้อมูลนักเรียนเข้ามาเลยจ้า~ 🏃‍♂️💨</td></tr>`;
            } else {
                players.forEach(p => {
                    const pre = p.preTest !== null ? p.preTest : '-';
                    const post = p.postTest !== null ? p.postTest : '-';
                    let progress = '-';
                    let progressStyle = 'bg-slate-100 text-slate-500';
                    
                    if (p.preTest !== null && p.postTest !== null) {
                        const diff = p.postTest - p.preTest;
                        if (diff > 0) { progress = `+${diff}`; progressStyle = 'text-green-600 bg-green-100 border-2 border-green-200'; }
                        else if (diff < 0) { progress = diff; progressStyle = 'text-rose-600 bg-rose-100 border-2 border-rose-200'; }
                        else { progress = '0'; progressStyle = 'text-slate-600 bg-slate-100 border-2 border-slate-200'; }
                    }

                    const wsStatus = p.worksheet !== null 
                        ? (p.worksheetGraded 
                            ? `<button onclick="viewWorksheet('${p.name}')" class="bg-green-100 text-green-600 border-2 border-green-200 px-4 py-1.5 rounded-full font-bold hover:bg-green-200 transition-colors shadow-sm"><i class="fa-solid fa-check-circle mr-1"></i> ตรวจแล้ว (${p.worksheetScore})</button>`
                            : `<button onclick="viewWorksheet('${p.name}')" class="bg-amber-100 text-amber-600 border-2 border-amber-200 px-4 py-1.5 rounded-full font-bold hover:bg-amber-200 transition-colors shadow-sm animate-pulse"><i class="fa-solid fa-hourglass-half mr-1"></i> รอตรวจ</button>`)
                        : `<span class="bg-slate-100 text-slate-400 px-4 py-1.5 rounded-full font-bold border-2 border-slate-200">ยังไม่ส่ง</span>`;

                    html += `
                        <tr class="hover:bg-indigo-50/50 transition-colors group">
                            <td class="p-5 font-bold text-slate-700 text-lg flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-400 group-hover:scale-110 transition-transform">
                                    <i class="fa-solid fa-child-reaching"></i>
                                </div>
                                ${p.name}
                            </td>
                            <td class="p-5 text-center font-black text-slate-500 text-xl">${pre}</td>
                            <td class="p-5 text-center">${wsStatus}</td>
                            <td class="p-5 text-center font-black text-slate-500 text-xl">${post}</td>
                            <td class="p-5 text-center">
                                ${progress !== '-' ? `<span class="px-4 py-1.5 rounded-full font-black text-lg ${progressStyle}">${progress}</span>` : '-'}
                            </td>
                        </tr>
                    `;
                });
            }

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            return html;
        }

        window.viewWorksheet = function(name) {
            const p = state.players[name];
            const ans = p.worksheet;
            const currentScore = p.worksheetScore !== null ? p.worksheetScore : '';
            
            Swal.fire({
                title: `<span class="font-cute text-3xl text-indigo-600">ตรวจใบงานของ ${name}</span>`,
                html: `
                    <div class="text-left font-cute text-slate-700 bg-[url('https://www.transparenttextures.com/patterns/notebook.png')] bg-amber-50 p-6 rounded-2xl mt-4 border-2 border-amber-200 shadow-inner overflow-y-auto max-h-[60vh]">
                        <p class="font-bold text-lg text-rose-500 mb-2">๑. อธิบายความหมาย "พอลิเมอร์" และ "มอนอเมอร์"</p>
                        <p class="mb-6 text-xl border-b-2 border-dashed border-amber-300 pb-2 text-blue-700 bg-white/60 px-4 py-2 rounded-xl">${ans[0] || '-'}</p>
                        
                        <p class="font-bold text-lg text-rose-500 mb-2">๒. ปฏิกิริยาแบบเติม กับ แบบควบแน่น ต่างกันยังไง?</p>
                        <p class="mb-6 text-xl border-b-2 border-dashed border-amber-300 pb-2 text-blue-700 bg-white/60 px-4 py-2 rounded-xl">${ans[1] || '-'}</p>
                        
                        <p class="font-bold text-lg text-rose-500 mb-2">๓. ยกตัวอย่างของที่ทำจากพอลิเมอร์มา ๓ อย่าง</p>
                        <p class="mb-8 text-xl border-b-2 border-dashed border-amber-300 pb-2 text-blue-700 bg-white/60 px-4 py-2 rounded-xl">${ans[2] || '-'}</p>
                        
                        <div class="bg-indigo-50 border-4 border-indigo-200 p-4 rounded-2xl flex flex-col items-center justify-center">
                            <label class="font-black text-indigo-500 text-xl mb-3">ให้คะแนนใบงาน (เต็ม 10)</label>
                            <input type="number" id="grading-score" min="0" max="10" value="${currentScore}" class="w-32 text-center text-4xl font-black text-indigo-700 border-4 border-indigo-300 rounded-2xl p-2 outline-none focus:border-indigo-500 shadow-inner bg-white">
                        </div>
                    </div>
                `,
                width: 700,
                showCancelButton: true,
                confirmButtonText: '<i class="fa-solid fa-check"></i> บันทึกคะแนน',
                cancelButtonText: 'ปิดเฉยๆ',
                confirmButtonColor: '#22c55e',
                cancelButtonColor: '#94a3b8',
                customClass: { popup: 'rounded-3xl border-4 border-indigo-200 shadow-2xl font-cute' },
                preConfirm: () => {
                    const scoreInput = document.getElementById('grading-score').value;
                    if(scoreInput === '') {
                        Swal.showValidationMessage('กรุณาใส่คะแนนให้เด็กๆ ด้วยนะจ๊ะ');
                        return false;
                    }
                    if(scoreInput < 0 || scoreInput > 10) {
                        Swal.showValidationMessage('คะแนนต้องอยู่ระหว่าง 0 - 10 จ้า');
                        return false;
                    }
                    return scoreInput;
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    state.players[name].worksheetScore = parseFloat(result.value);
                    state.players[name].worksheetGraded = true;
                    saveState();
                    render();
                    Toast.fire({ icon: 'success', title: 'ตรวจงานและบันทึกคะแนนเรียบร้อย!', confirmButtonColor: '#10b981' });
                }
            });
        }

        window.exportExcel = function() {
            let csv = '\uFEFF'; 
            csv += 'ชื่อนักเรียน,คะแนนก่อนเรียน,การส่งใบงาน,คะแนนใบงาน,คะแนนหลังเรียน,พัฒนาการ\n';
            
            Object.values(state.players).forEach(p => {
                const pre = p.preTest !== null ? p.preTest : '';
                const post = p.postTest !== null ? p.postTest : '';
                let wsStatus = 'ยังไม่ส่ง';
                let wsScore = '';
                if (p.worksheet !== null) {
                    if (p.worksheetGraded) {
                        wsStatus = 'ตรวจแล้ว';
                        wsScore = p.worksheetScore;
                    } else {
                        wsStatus = 'รอตรวจ';
                    }
                }
                
                let diff = '';
                if (p.preTest !== null && p.postTest !== null) {
                    diff = p.postTest - p.preTest;
                }
                csv += `${p.name},${pre},${wsStatus},${wsScore},${post},${diff}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'คะแนนนักเรียน_Polymer.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            Toast.fire({ icon: 'success', title: 'โหลดเสร็จแล้ว!', text: 'ไฟล์ Excel บันทึกเรียบร้อยครับ', confirmButtonColor: '#10b981' });
        }

        window.confirmClearData = function() {
            Swal.fire({
                title: '<span class="font-cute text-3xl text-rose-500">ล้างห้องเรียน?</span>',
                html: '<p class="font-bold text-slate-500 font-cute">ข้อมูลทั้งหมดจะหายไปเลยนะ แน่ใจมั้ยเอ่ย?</p>',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#94a3b8',
                confirmButtonText: 'ใช่ ลบเลย!',
                cancelButtonText: 'ไม่ดีกว่า',
                customClass: { popup: 'rounded-3xl border-4 border-rose-200 shadow-xl font-cute' }
            }).then((result) => {
                if (result.isConfirmed) {
                    state.players = {};
                    saveState();
                    render();
                    Toast.fire({ icon: 'success', title: 'ห้องเรียนสะอาดกริ๊บ!', confirmButtonColor: '#10b981' });
                }
            });
        }

        // เริ่มต้นระบบ
        loadState();
        render();
    </script>
</body>
</html>
